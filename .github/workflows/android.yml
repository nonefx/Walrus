name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'adopt'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Package
        path: build
        
    - name: tar the fu.ker
      run: tar -czvf fa.tar.gz build/outputs/apk
      
    - name: upload2
      uses: actions/upload-artifact@v7
      with:
        name: p2
        path: fa.tar.gz
